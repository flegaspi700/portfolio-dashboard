# Token check (Phase 0 task, threat model T1 and T2 in docs/security.md)
#
# Proves the read token works from an Action without leaking anything:
# it reads one repo's portfolio.json and logs only facts about it (status,
# size, whether it is valid JSON), never its content. Run by hand after
# creating or renewing the token; the run log is public, so check it.
#
# Security rules (T2): manual trigger only, no permissions for the
# workflow's own GITHUB_TOKEN, no third-party Actions (nothing to pin),
# the token and the input reach the script only through env variables,
# and the input is validated before use.

name: token-check

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repo the token can read (name only, under flegaspi700)"
        required: true
        type: string

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read portfolio.json with the token, log nothing private
        env:
          TOKEN: ${{ secrets.PORTFOLIO_READ_TOKEN }}
          REPO: ${{ inputs.repo }}
        shell: python3 {0}
        run: |
          import json, os, re, sys, urllib.error, urllib.request

          token = os.environ.get("TOKEN", "")
          repo = os.environ.get("REPO", "")
          if not token:
              sys.exit("PORTFOLIO_READ_TOKEN is empty or not set: store it again.")
          # A repo name, nothing else: no slashes, no URL pieces
          if not re.fullmatch(r"[A-Za-z0-9._-]{1,100}", repo):
              sys.exit("The repo input must be a plain repo name.")

          url = f"https://api.github.com/repos/flegaspi700/{repo}/contents/portfolio.json"
          request = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github.raw+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read()
          except urllib.error.HTTPError as error:
              # The status only: the error body could quote the request
              sys.exit(f"Read failed: HTTP {error.code}.")
          except urllib.error.URLError as error:
              sys.exit(f"Read failed: {type(error.reason).__name__}.")

          try:
              json.loads(body)
              valid = "yes"
          except ValueError:
              valid = "no"
          print(f"Read portfolio.json: HTTP 200, {len(body)} bytes, valid JSON: {valid}.")
          print("Content not logged by design.")
